<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2b3150" />
    <meta name="description" content="Boutique en ligne BETCC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BETCC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      #splash{display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:system-ui,sans-serif;color:#0b4a6f}
      #splash b{font-size:28px;letter-spacing:.05em}
      #splash i{width:28px;height:28px;border:3px solid #bae0f5;border-top-color:#0b4a6f;border-radius:50%;animation:sp .8s linear infinite}
      @keyframes sp{to{transform:rotate(360deg)}}
    </style>
    <title>BETCC — Boutique</title>
  </head>
  <body>
    <div id="root"><div id="splash"><b>BETCC</b><i></i></div></div>
    <script>try{var n=localStorage.getItem("unix.brand");if(n){document.title=document.title.replace("BETCC",n);var b=document.querySelector("#splash b");if(b)b.textContent=n}}catch(e){}</script>
<script>try{if(/^\/(etudiant|admin\/formation|formations|decouvrir\/formations|rejoindre|verification|mes-cours|reunions|c)(\/|$)/.test(location.pathname)){var i=document.querySelector('link[rel="icon"]');if(i)i.href="/favicon-iga.svg";var m=document.querySelector('meta[name="theme-color"]');if(m)m.content="#1f64c0";var s=document.querySelector("#splash b");if(s)s.textContent="IGA"}}catch(e){}</script>
<script>try{if(/^\/(etudiant|admin\/formation|formations|decouvrir\/formations|rejoindre|verification|mes-cours|reunions|c)(\/|$)/.test(location.pathname)){var mf=document.querySelector('link[rel="manifest"]');if(!mf){mf=document.createElement("link");mf.rel="manifest";mf.dataset.created="1";document.head.appendChild(mf)}else{mf.dataset.shopHref=mf.getAttribute("href")||""}mf.href="/manifest-iga.webmanifest";var ap=document.querySelector('link[rel="apple-touch-icon"]');if(ap){ap.dataset.shopHref=ap.getAttribute("href")||"";ap.href="/apple-touch-icon-iga.png"}var at=document.querySelector('meta[name="apple-mobile-web-app-title"]');if(at){at.dataset.shopContent=at.content;at.content="IGA"}}}catch(e){}</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
